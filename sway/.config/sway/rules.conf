
for_window [class="^.*"] border pixel 2
default_border pixel 1
hide_edge_borders none #smart 
gaps inner 8
gaps outer 4
blur enable
corner_radius 4
set $opacity 0.95

# Nord theme colors
set $nord0  #2E3440
set $nord1  #3B4252
set $nord2  #434C5E
set $nord3  #4C566A
set $nord4  #D8DEE9
set $nord5  #E5E9F0
set $nord6  #ECEFF4
set $nord7  #8FBCBB
set $nord8  #88C0D0
set $nord9  #81A1C1
set $nord10 #5E81AC
set $nord11 #BF616A
set $nord12 #D08770
set $nord13 #EBCB8B
set $nord14 #A3BE8C
set $nord15 #B48EAD

# Sway window border colors (titlebar, background, text, indicator, border)
client.focused           $nord10 $nord0 $nord4 $nord8  $nord10
client.focused_inactive  $nord2  $nord0 $nord3 $nord3  $nord2
client.unfocused         $nord1  $nord0 $nord3 $nord3  $nord1
client.urgent            $nord11 $nord0 $nord11 $nord3 $nord11
client.placeholder       $nord3  $nord0 $nord4 $nord3  $nord3
client.background        $nord0


# Window opacity
for_window [class=".*"] opacity $opacity
for_window [app_id=".*"] opacity $opacity


for_window [app_id="org.pulseaudio.pavucontrol"] floating enable, resize set 1200 900
for_window [app_id="lxappearance"] floating enable, resize set 1200 900
for_window [app_id="Alacritty"] floating enable, sticky enable, resize set 1200 900
for_window [app_id="zen"] opacity 1.0
for_window [app_id="kitty"] opacity 0.85


# assigments
assign [class="Slack"] workspace 1
# assign [class=""] workspace 2
assign [class="Google-chrome"] workspace 4
# assign [class="Alacritty"] workspace 5
# assign [class=""] workspace 6
assign [app_id="zen"] workspace 9
assign [class="Vivaldi-stable"] workspace 9

# launch xfce4-power-manager
exec --no-startup-id xfce4-power-manager
